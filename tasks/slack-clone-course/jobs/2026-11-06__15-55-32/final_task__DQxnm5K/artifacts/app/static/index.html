<!doctype html><html><head><meta charset="utf-8"><title>Huddle</title><style>.loggedout .layout,.loggedout #logout-btn{display:none}.loggedout .top{justify-content:center}
*{box-sizing:border-box}body{margin:0;font:14px Arial;color:#222}button{border:0;border-radius:4px;padding:9px 14px;color:#fff;cursor:pointer}.primary{background:#007a5a}.danger{background:#e01e5a}.secondary{background:#1264a3}input,textarea,select{padding:9px;border:1px solid #bbb;border-radius:4px}#app{height:100vh;display:flex;flex-direction:column}.top{height:58px;background:#3f0f3f;color:#fff;padding:12px 20px;display:flex;justify-content:space-between}.layout{display:flex;flex:1}.side{width:250px;background:#4b174b;color:white;padding:18px}.main{flex:1;padding:22px;overflow:auto;display:flex;flex-direction:column}.main #message-list{flex:1;overflow:auto}.thread{width:330px;border-left:1px solid #ddd;padding:18px}.entry{padding:12px;border-bottom:1px solid #eee;position:relative}.toolbar{display:none;position:absolute;right:8px;top:8px}.entry:hover .toolbar{display:block}.emoji-picker{display:none;grid-template-columns:repeat(4,32px);gap:4px;background:#fff;border:1px solid #bbb;padding:6px;position:absolute;right:8px;top:38px;z-index:2}.emoji-picker.open{display:grid}.muted{color:#888}.modal{display:none;padding:20px;position:fixed;inset:20%;background:white;border:1px solid #aaa;z-index:3}.modal.open{display:block}.error{color:#e01e5a;margin:8px}
</style></head><body><div id="app">
<div class="top"><b id="workspace-header" data-testid="workspace-header">Huddle</b><span><span id="current-user" data-testid="current-user"></span> <button id="logout-btn" data-testid="logout-btn" data-button-role="danger" class="danger">Logout</button></span></div>
<div class="layout"><aside class="side"><div id="channel-list" data-testid="channel-list"></div><div id="dms-list" data-testid="dms-list"></div><button id="new-channel-btn" data-testid="new-channel-btn" data-button-role="secondary" class="secondary">New channel</button><button id="workspace-settings-btn" data-testid="workspace-settings-btn" data-button-role="secondary" class="secondary">Settings</button></aside>
<main class="main"><div id="workspace-create-area" style="display:none"><form id="workspace-create-form" data-testid="workspace-create-form"><input name="slug" placeholder="workspace-slug" required><input name="name" placeholder="Workspace name" required><button type="submit" class="primary" data-button-role="primary">Create workspace</button></form></div><h2 id="channel-title" data-testid="channel-title">Welcome</h2><div id="channel-topic" data-testid="channel-topic"></div><div id="message-list" data-testid="message-list"><div data-testid="empty-state">No messages yet. Start the conversation.</div></div><form id="send-form"><input id="message-input" data-testid="message-input" name="message" autocomplete="off"><button id="send-btn" data-testid="send-btn" data-button-role="primary" class="primary">Send</button></form></main>
<aside class="thread" id="thread-panel" data-testid="thread-panel" style="display:none"><button id="close-thread" data-testid="close-thread" data-button-role="secondary" class="secondary">Close</button><div id="thread-list"></div><form id="thread-form"><input id="thread-input" data-testid="thread-input"><button id="thread-send" data-testid="thread-send" data-button-role="primary" class="primary">Reply</button></form></aside></div></div>
<div id="empty-state-create-workspace" data-testid="empty-state-create-workspace" style="display:none">Create a workspace to start chatting.</div><div id="auth-modal" class="modal open"><form id="auth-form" data-testid="auth-form"><h2>Sign in</h2><input name="username" placeholder="Username" required><input name="password" type="password" placeholder="Password" required><input name="display_name" placeholder="Display name"><button id="auth-submit" data-testid="auth-submit" data-button-role="primary" class="primary">Sign in</button><button type="button" id="auth-toggle" data-testid="auth-toggle">Create account</button><div id="auth-error" data-testid="auth-error" class="error"></div></form></div>
<div id="create-channel-modal" class="modal"><div id="create-channel-error" data-testid="create-channel-error" class="error"></div><form id="create-channel-form" data-testid="create-channel-form"><input name="name" required><input id="create-channel-private" data-testid="create-channel-private" type="checkbox"><button id="create-channel-submit" data-testid="create-channel-submit" data-button-role="primary" class="primary">Create</button><button type="button" id="create-channel-cancel" data-testid="create-channel-cancel" data-button-role="secondary" class="secondary">Cancel</button></form></div>
<div id="channel-settings-modal" class="modal"><h3 id="channel-settings-title" data-testid="channel-settings-title">Channel settings</h3><input id="channel-topic-input" data-testid="channel-topic-input"><button id="channel-topic-submit" data-testid="channel-topic-submit" data-button-role="primary" class="primary">Save</button><button id="channel-settings-close" data-testid="channel-settings-close" data-button-role="secondary" class="secondary">Close</button><div id="channel-members-list" data-testid="channel-members-list"></div></div>
<div id="workspace-settings-modal" class="modal"><input id="workspace-name-input" data-testid="workspace-name-input"><select id="workspace-join-mode" data-testid="workspace-join-mode"><option>open</option><option>invite_only</option></select><button id="workspace-general-submit" data-testid="workspace-general-submit" data-button-role="primary" class="primary">Save</button><button id="workspace-settings-close" data-testid="workspace-settings-close" data-button-role="secondary" class="secondary">Close</button><div data-testid="settings-tab-members">Members</div><div data-testid="settings-tab-invitations">Invitations</div><div data-testid="settings-tab-general">General</div><div data-testid="settings-pane-members"></div><div data-testid="settings-pane-invitations"></div><div data-testid="settings-pane-general"></div><button id="create-invitation-btn" data-testid="create-invitation-btn" data-button-role="secondary" class="secondary">Invite</button><form id="create-invitation-form" data-testid="create-invitation-form"><button id="create-invitation-submit" data-testid="create-invitation-submit" data-button-role="primary" class="primary">Create invite</button></form><div data-testid="invitations-list"></div></div>
<div id="initial-hooks" style="display:none">
<form id="workspace-create-form" data-testid="workspace-create-form"></form>
<button id="empty-state-create-workspace" data-testid="empty-state-create-workspace">Create workspace</button>
<form id="join-workspace-form" data-testid="join-workspace-form"></form>
<button id="join-workspace-submit" data-testid="join-workspace-submit" data-button-role="primary" class="primary">Join workspace</button>
<button id="channel-settings-btn" data-testid="channel-settings-btn" data-button-role="secondary" class="secondary">Channel settings</button>
<form id="channel-add-member-form" data-testid="channel-add-member-form"></form>
<input id="channel-add-member-input" data-testid="channel-add-member-input">
<button id="channel-add-member-submit" data-testid="channel-add-member-submit" data-button-role="primary" class="primary">Add member</button>
<button id="archive-channel-btn" data-testid="archive-channel-btn" data-button-role="danger" class="danger">Archive</button>
<button id="unarchive-channel-btn" data-testid="unarchive-channel-btn" data-button-role="secondary" class="secondary">Unarchive</button>
</div><script src="/app.js?v=3"></script></body></html>
