<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Huddle</title><link rel="stylesheet" href="/static/style.css"></head><body>
<header data-testid="workspace-header"><strong>Huddle</strong><span data-testid="current-user"></span><button id="workspace-settings-btn" data-testid="workspace-settings-btn" data-button-role="secondary">Workspace settings</button><button id="logout-btn" data-testid="logout-btn" data-button-role="danger">Log out</button></header>
<div id="auth-error" data-testid="auth-error" style="display:block;color:#e01e5a;min-height:0"></div><div id="auth-modal"><form data-testid="auth-form"><h1>Welcome to Huddle</h1><input name="username" placeholder="Username"><input name="password" type="password" placeholder="Password"><button id="auth-submit" data-testid="auth-submit" data-button-role="primary">Log in</button><button type="button" id="auth-toggle" data-testid="auth-toggle">Create account</button></form></div>
<aside><section data-testid="channel-list"><h2>Channels</h2></section><section data-testid="dms-list"><h2>Direct messages</h2></section><button id="new-channel-btn" data-testid="new-channel-btn" data-button-role="secondary">New channel</button><form data-testid="workspace-create-form"><input name="slug" placeholder="workspace-slug"><input name="name" placeholder="Workspace name"><button type="submit" data-testid="empty-state-create-workspace">Create workspace</button></form><form data-testid="join-workspace-form"><input name="join" placeholder="Workspace code"><button id="join-workspace-submit" data-testid="join-workspace-submit" data-button-role="primary">Join workspace</button><span id="join-workspace-error" data-testid="join-workspace-error"></span></form></aside>
<main><div class="channel-head"><h2 id="channel-title" data-testid="channel-title">#general</h2><span id="channel-topic" data-testid="channel-topic"></span><button id="channel-settings-btn" data-testid="channel-settings-btn" data-button-role="secondary">Channel settings</button></div><div id="message-list" data-testid="message-list"><p class="empty">No messages yet. Start the conversation!</p></div><form id="composer"><input id="message-input" data-testid="message-input" name="body" placeholder="Write a message"><button id="send-btn" data-testid="send-btn" data-button-role="primary">Send</button></form></main>
<aside id="thread-panel" data-testid="thread-panel" hidden><h2>Thread</h2><div id="thread-messages"></div><input id="thread-input" data-testid="thread-input"><button id="thread-send" data-testid="thread-send" data-button-role="primary">Reply</button><button id="close-thread" data-testid="close-thread" data-button-role="secondary">Close</button></aside>
<div id="create-channel-modal" hidden><form id="create-channel-form" data-testid="create-channel-form"><input name="name"><label><input id="create-channel-private" data-testid="create-channel-private" type="checkbox"> Private</label><span id="create-channel-error" data-testid="create-channel-error"></span><button id="create-channel-submit" data-testid="create-channel-submit" data-button-role="primary">Create</button><button id="create-channel-cancel" data-testid="create-channel-cancel" data-button-role="secondary">Cancel</button></form></div>
<div id="channel-settings-modal" hidden><h2 id="channel-settings-title" data-testid="channel-settings-title">Channel settings</h2><div id="channel-members-list" data-testid="channel-members-list"></div><form id="channel-add-member-form" data-testid="channel-add-member-form"><input id="channel-add-member-input" data-testid="channel-add-member-input"><button id="channel-add-member-submit" data-testid="channel-add-member-submit" data-button-role="primary">Add member</button></form><input id="channel-topic-input" data-testid="channel-topic-input"><button id="channel-topic-submit" data-testid="channel-topic-submit" data-button-role="primary">Save topic</button><button id="archive-channel-btn" data-testid="archive-channel-btn" data-button-role="danger">Archive</button><button id="unarchive-channel-btn" data-testid="unarchive-channel-btn" data-button-role="secondary">Unarchive</button><button id="channel-settings-close" data-testid="channel-settings-close" data-button-role="secondary">Close</button></div>
<div id="workspace-settings-modal" hidden><input id="workspace-name-input" data-testid="workspace-name-input"><select id="workspace-join-mode" data-testid="workspace-join-mode"><option>open</option><option>invite_only</option></select><button id="workspace-general-submit" data-testid="workspace-general-submit" data-button-role="primary">Save</button><button id="workspace-settings-close" data-testid="workspace-settings-close" data-button-role="secondary">Close</button><button id="settings-tab-members" data-testid="settings-tab-members">Members</button><button id="settings-tab-invitations" data-testid="settings-tab-invitations">Invitations</button><button id="settings-tab-general" data-testid="settings-tab-general">General</button><div id="settings-pane-members" data-testid="settings-pane-members"></div><div id="settings-pane-invitations" data-testid="settings-pane-invitations"><button id="create-invitation-btn" data-testid="create-invitation-btn" data-button-role="secondary">Invite</button><form id="create-invitation-form" data-testid="create-invitation-form"><button id="create-invitation-submit" data-testid="create-invitation-submit" data-button-role="primary">Create invitation</button></form><div id="invitations-list" data-testid="invitations-list"></div></div><div id="settings-pane-general" data-testid="settings-pane-general"></div></div>
<script src="/static/app.js"></script></body></html>
