<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Huddle</title><link rel="stylesheet" href="/static/style.css"></head><body>
<div id="auth-modal" class="auth"><form data-testid="auth-form" id="auth-form"><h1>Huddle</h1><p id="auth-mode">Log in</p><label>Username<input name="username" required></label><label>Password<input name="password" type="password" required></label><div id="auth-error" data-testid="auth-error"></div><button data-testid="auth-submit" data-button-role="primary" type="submit">Log in</button><button data-testid="auth-toggle" type="button">Sign up</button></form></div>
<div id="app" hidden><aside><h2 data-testid="workspace-header">No workspace</h2><div data-testid="current-user"></div><button data-testid="logout-btn" data-button-role="danger">Log out</button><button data-testid="workspace-settings-btn" data-button-role="secondary">Workspace settings</button><h3>Channels</h3><div data-testid="channel-list"></div><div data-testid="dms-list"></div><button data-testid="new-channel-btn" data-button-role="secondary">New channel</button><form data-testid="join-workspace-form" hidden><input name="slug" placeholder="workspace slug"><button data-testid="join-workspace-submit" data-button-role="primary" type="submit">Join workspace</button></form><section id="empty-workspace"><button data-testid="empty-state-create-workspace" data-button-role="primary">Create workspace</button><form data-testid="workspace-create-form" hidden><input name="slug" placeholder="slug"><input name="name" placeholder="name"><button data-button-role="primary" type="submit">Create</button></form></section></aside>
<main><header><h2 data-testid="channel-title">Welcome</h2><span data-testid="channel-topic"></span><button data-testid="channel-settings-btn" data-button-role="secondary">Channel settings</button></header><div class="message-list" data-testid="message-list"><div class="empty">No messages yet — start the conversation.</div></div><form id="composer"><input data-testid="message-input" autocomplete="off" placeholder="Message"><button data-testid="send-btn" data-button-role="primary">Send</button></form></main>
<section data-testid="thread-panel" id="thread-panel" hidden><button data-testid="close-thread" data-button-role="secondary">Close</button><h3>Thread</h3><div id="thread-list"></div><form id="thread-form"><input data-testid="thread-input"><button data-testid="thread-send" data-button-role="primary">Send</button></form></section></div>
<div id="create-channel-modal" class="modal" hidden><form data-testid="create-channel-form"><h3>Create channel</h3><input name="name"><label><input data-testid="create-channel-private" type="checkbox"> Private</label><div data-testid="create-channel-error"></div><button data-testid="create-channel-submit" data-button-role="primary">Create</button><button data-testid="create-channel-cancel" data-button-role="secondary" type="button">Cancel</button></form></div>
<div id="channel-settings-modal" class="modal" hidden><div><h3 data-testid="channel-settings-title">Channel settings</h3><button data-testid="channel-settings-close" data-button-role="secondary">Close</button><div data-testid="channel-members-list"></div><form data-testid="channel-add-member-form"><input data-testid="channel-add-member-input"><button data-testid="channel-add-member-submit" data-button-role="primary">Add</button></form><input data-testid="channel-topic-input"><button data-testid="channel-topic-submit" data-button-role="primary">Save topic</button><button data-testid="archive-channel-btn" data-button-role="danger">Archive</button><button data-testid="unarchive-channel-btn" data-button-role="secondary">Unarchive</button></div></div>
<div id="workspace-settings-modal" class="modal" hidden><div><button data-testid="workspace-settings-close" data-button-role="secondary">Close</button><input data-testid="workspace-name-input"><select data-testid="workspace-join-mode"><option>open</option></select><button data-testid="workspace-general-submit" data-button-role="primary">Save</button><button data-testid="settings-tab-members">Members</button><button data-testid="settings-tab-invitations">Invitations</button><button data-testid="settings-tab-general">General</button><div data-testid="settings-pane-members"></div><div data-testid="settings-pane-invitations"></div><div data-testid="settings-pane-general"></div><button data-testid="create-invitation-btn" data-button-role="secondary">Invite</button><form id="create-invitation-form" data-testid="create-invitation-form"><button data-testid="create-invitation-submit" data-button-role="primary">Create invite</button></form><div data-testid="invitations-list"></div></div></div>
<script src="/static/app.js"></script></body></html>
