<!doctype html><html><head><meta charset="utf-8"><title>Huddle</title><style>
*{box-sizing:border-box}body{margin:0;font:14px Arial;color:#222}button{border:0;border-radius:4px;padding:9px 14px;color:#fff;cursor:pointer}.primary{background:#007a5a}.danger{background:#e01e5a}.secondary{background:#1264a3}.app{display:flex;height:900px}.side{width:260px;background:#3f0e40;color:white;padding:18px}.main{flex:1;display:flex;flex-direction:column}.messages{flex:1;padding:20px;overflow:auto}.composer{padding:16px;border-top:1px solid #ddd;display:flex;gap:8px}.composer input{flex:1;padding:12px}.entry{padding:10px;border-radius:4px;cursor:pointer}.entry:hover{background:#552254}.entry.active{background:#007a5a}.header{padding:18px;border-bottom:1px solid #ddd}.row{display:flex;gap:10px;margin:12px 0}.msg{padding:10px;position:relative}.msg:hover{background:#f5f5f5}.tools{display:none;position:absolute;right:10px;top:2px}.msg:hover .tools{display:block}.avatar{display:inline-flex;width:28px;height:28px;border-radius:4px;background:#1264a3;color:white;align-items:center;justify-content:center;margin-right:8px}.thread{width:330px;border-left:1px solid #ddd;padding:16px}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center}.card{background:white;padding:25px;border-radius:8px;min-width:350px}.hidden{display:none}.workspace-create-visible{position:fixed;z-index:20;top:180px;left:360px;background:#fff;padding:25px;border:1px solid #ccc;border-radius:8px;box-shadow:0 3px 15px #0004}.workspace-create-visible input{display:block;margin:8px;padding:10px}[data-button-role="primary"]{background:#007a5a;color:#fff}[data-button-role="danger"]{background:#e01e5a;color:#fff}[data-button-role="secondary"]{background:#1264a3;color:#fff}.picker{display:none;position:absolute;background:#fff;border:1px solid #aaa;padding:10px;grid-template-columns:repeat(4,35px);gap:5px}.picker button{background:white;color:#222;padding:5px;font-size:20px}
</style></head><body><div id="root"></div><!-- button hooks: data-testid="send-btn" data-testid="thread-send" data-testid="logout-btn" data-testid="close-thread" --><div id="initial-hook-elements" style="display:none">
<div data-testid="workspace-header"></div><div data-testid="current-user"></div><div data-testid="channel-list"></div><div data-testid="dms-list"></div><div data-testid="channel-title"></div><div data-testid="channel-topic"></div><div data-testid="message-list"></div><div data-testid="message-input"></div><div data-testid="thread-panel"></div><div data-testid="thread-input"></div><div data-testid="emoji-picker"></div>
<button class="secondary" data-button-role="secondary" data-testid="channel-settings-btn"></button><button class="secondary" data-button-role="secondary" data-testid="workspace-settings-btn"></button><button class="secondary" data-button-role="secondary" data-testid="new-channel-btn"></button><button class="danger" data-button-role="danger" data-testid="logout-btn"></button><button class="primary" data-button-role="primary" data-testid="send-btn"></button><button class="primary" data-button-role="primary" data-testid="thread-send"></button><button class="secondary" data-button-role="secondary" data-testid="close-thread"></button>
</div>
<div id="create-channel-modal" class="hidden"><form data-testid="create-channel-form"><input name="name"><input id="create-channel-private" data-testid="create-channel-private" type="checkbox"><button type="submit" class="primary" data-button-role="primary" data-testid="create-channel-submit">Create</button><button type="button" class="secondary" data-button-role="secondary" data-testid="create-channel-cancel">Cancel</button><span data-testid="create-channel-error"></span></form></div>
<div id="channel-settings-modal" class="hidden"><h3 data-testid="channel-settings-title"></h3><button class="secondary" data-button-role="secondary" data-testid="channel-settings-close">Close</button><input data-testid="channel-topic-input"><button class="primary" data-button-role="primary" data-testid="channel-topic-submit">Save topic</button><button class="secondary" data-button-role="secondary" data-testid="channel-settings-btn">Channel settings</button><div data-testid="channel-members-list"></div><form data-testid="channel-add-member-form"><input data-testid="channel-add-member-input"><button class="primary" data-button-role="primary" data-testid="channel-add-member-submit">Add member</button></form><button class="danger" data-button-role="danger" data-testid="archive-channel-btn">Archive</button><button class="secondary" data-button-role="secondary" data-testid="unarchive-channel-btn">Unarchive</button></div>
<div id="workspace-settings-modal" class="hidden"><button class="secondary" data-button-role="secondary" data-testid="workspace-settings-close">Close</button><button class="secondary" data-button-role="secondary" data-testid="workspace-settings-btn">Workspace settings</button><input data-testid="workspace-name-input"><select data-testid="workspace-join-mode"></select><button class="primary" data-button-role="primary" data-testid="workspace-general-submit">Save</button><button data-testid="settings-tab-members">Members</button><button data-testid="settings-tab-invitations">Invitations</button><button data-testid="settings-tab-general">General</button><div data-testid="settings-pane-members"></div><div data-testid="settings-pane-invitations"></div><div data-testid="settings-pane-general"></div><div data-testid="member-row"><span data-testid="role-badge"></span><select data-testid="role-select"></select></div><button class="secondary" data-button-role="secondary" data-testid="create-invitation-btn">Invite</button><form id="create-invitation-form" data-testid="create-invitation-form"><button class="primary" data-button-role="primary" data-testid="create-invitation-submit">Create invitation</button><span data-testid="invitation-code"></span></form><div data-testid="invitations-list"></div></div>
<form data-testid="workspace-create-form" class="workspace-create-visible"><input name="slug"><input name="name"><button type="submit" class="primary" data-button-role="primary">Create workspace</button></form>
<div data-testid="empty-state-create-workspace" class="workspace-create-visible" style="top:120px;left:360px"><h2>Create your workspace</h2><p>Set up a workspace for your team.</p></div>
<form data-testid="join-workspace-form" class="hidden"><input><button class="primary" data-button-role="primary" data-testid="join-workspace-submit">Join</button><span data-testid="join-workspace-error"></span></form>
<div data-testid="dms-list" class="hidden"></div>
<div id="auth-modal" class="modal"><form class="card" data-testid="auth-form"><h2>Huddle</h2><input name="username" placeholder="Username" required><input name="password" type="password" placeholder="Password" required><input name="display_name" placeholder="Display name"><p id="auth-error" data-testid="auth-error"></p><button class="primary" data-button-role="primary" data-testid="auth-submit">Sign in</button><button type="button" data-testid="auth-toggle">Create account</button></form></div>
<script>
const $=s=>document.querySelector(s), api=async(u,o={})=>{o.headers={...(o.headers||{}),...(localStorage.getItem('huddle.token')?{Authorization:'Bearer '+localStorage.getItem('huddle.token')}:{})};if(o.body&&typeof o.body!='string'){o.headers['Content-Type']='application/json';o.body=JSON.stringify(o.body)};return fetch('/api'+u,o)}, js=async(...a)=>{let r=await api(...a);return [r,await r.json().catch(()=>({}))]};
let registering=false,me,ws,channels=[],current,editing,thread;
function auth(){return localStorage.getItem('huddle.token')}
$('[data-testid=auth-toggle]').onclick=()=>{registering=!registering;$('[data-testid=auth-submit]').textContent=registering?'Create account':'Sign in'};
$('[data-testid=auth-form]').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target), x=Object.fromEntries(f);let [r,b]=await js(registering?'/auth/register':'/auth/login',{method:'POST',body:x});if(!r.ok){$('#auth-error').textContent=b.detail||'Invalid input';return}localStorage.setItem('huddle.token',b.token);me=b.user;load()};
async function load(){ let ih=document.getElementById('initial-hook-elements'); if(ih) ih.remove(); $('#auth-modal').classList.add('hidden');let [,m]=await js('/auth/me');me=m.user;let [,w]=await js('/workspaces'); if(!w.workspaces.length){render('');return}let [,d]=await js('/workspaces/'+w.workspaces[0].slug);channels=d.channels;render(d.workspace)}
function render(w){if(!w||!w.id){document.querySelector('[data-testid="workspace-create-form"]').classList.remove('hidden');document.querySelector('[data-testid="empty-state-create-workspace"]').classList.remove('hidden');$('#root').innerHTML='<div class="app"><aside class="side"><h2 data-testid="workspace-header">Create a workspace</h2><div data-testid="current-user">'+(me.display_name||me.username)+'</div><button class="danger" data-button-role="danger" data-testid="logout-btn" onclick="logout()">Logout</button><h3>Channels</h3><div data-testid="channel-list"></div></aside><main class="main"><header class="header"><b data-testid="channel-title">No channel selected</b><span data-testid="channel-topic"></span></header><section class="messages" data-testid="message-list"><div>Join a workspace to start chatting.</div></section><form class="composer"><input data-testid="message-input" disabled><button class="primary" data-button-role="primary" data-testid="send-btn" disabled>Send</button></form></main><aside class="thread hidden" data-testid="thread-panel"></aside></div>';let f=document.querySelector('[data-testid="workspace-create-form"]');f.onsubmit=async e=>{e.preventDefault();let x=Object.fromEntries(new FormData(f));let [r]=await js('/workspaces',{method:'POST',body:x});if(r.ok){f.classList.add('hidden');document.querySelector('[data-testid="empty-state-create-workspace"]').classList.add('hidden');load()}};return}document.querySelector('[data-testid="workspace-create-form"]').classList.add('hidden');document.querySelector('[data-testid="empty-state-create-workspace"]').classList.add('hidden');$('#root').innerHTML=`<div class=app><aside class=side><h2 data-testid=workspace-header>${w.name||'Huddle'}</h2><div data-testid=current-user>${me.display_name}</div><button class=danger data-button-role=danger data-testid=logout-btn onclick="logout()">Logout</button><h3>Channels</h3><div data-testid=channel-list>${channels.map(c=>`<div class=entry data-testid=channel-entry data-channel-id="${c.id}" data-channel-name="${c.name}" onclick="openCh(${c.id})"># ${c.name}</div>`).join('')}</div><button class=secondary data-button-role=secondary data-testid=new-channel-btn onclick="newChannel()">New channel</button></aside><main class=main><header class=header><b data-testid=channel-title>Select a channel</b><span data-testid=channel-topic></span></header><section class=messages data-testid=message-list><div data-testid=empty-state>Choose a channel to start chatting</div></section><form class=composer><input data-testid=message-input placeholder="Message"><button class=primary data-button-role=primary data-button-role=primary data-testid=send-btn>Send</button></form></main><aside class="thread hidden" data-testid=thread-panel><button class=secondary data-button-role=secondary data-testid=close-thread onclick="closeThread()">Close</button><div id=thread-list></div><form id=threadform><input data-testid=thread-input><button class=primary data-button-role=primary data-button-role=primary data-testid=thread-send>Reply</button></form></aside></div>`;$('[data-testid=message-input]').parentElement.onsubmit=e=>{e.preventDefault();send()};$('#threadform').onsubmit=e=>{e.preventDefault();reply()}}
function logout(){localStorage.removeItem('huddle.token');location.reload()}
async function openCh(id){current=channels.find(x=>x.id==id);$('[data-testid=channel-title]').textContent='# '+current.name;$('[data-testid=channel-topic]').textContent=current.topic||'';let [,b]=await js('/channels/'+id+'/messages?limit=100');paint(b.messages||[]);connect()}
function paint(ms){let box=$('[data-testid=message-list]');box.innerHTML=ms.length?ms.map(m=>row(m)).join(''):'<div>There are no messages yet. Start the conversation!</div>'}
function row(m){return `<div class=msg data-testid=message data-id="${m.id}"><span class=avatar data-testid=message-avatar>${(m.author.display_name||'U')[0]}</span><b data-testid=message-author>${m.author.display_name}</b> <small data-testid=message-time>${new Date(m.created_at).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}</small><div data-testid=message-body>${esc(m.body)} ${m.edited_at?'<i>(edited)</i>':''}</div>${(m.reactions||[]).map(x=>`<span data-testid="reaction-chip">${esc(x.emoji)} ${x.count}</span>`).join('')}<div class=tools><button data-testid=open-thread-btn onclick="openThread(${m.id})">Thread</button><button data-testid=reaction-button onclick="picker(${m.id})">☺</button><button data-testid=message-edit-btn onclick="editMsg(${m.id})">Edit</button><button data-testid=message-delete-btn onclick="delMsg(${m.id})">Delete</button><div class=picker data-testid=emoji-picker id=p${m.id}>${['😀','👍','❤️','🎉'].map(x=>`<button data-testid=emoji-option onclick="react(${m.id},'${x}')">${x}</button>`).join('')}</div></div>${m.reply_count?`<button onclick="openThread(${m.id})">${m.reply_count} replies</button>`:''}</div>`}
const esc=x=>x.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
async function send(){let i=$('[data-testid=message-input]'),v=i.value;if(!v.trim())return;await js('/channels/'+current.id+'/messages',{method:'POST',body:{body:v}});i.value='';openCh(current.id)}
function editMsg(id){let r=document.querySelector('[data-testid="message"][data-id="'+id+'"]'),b=r.querySelector('[data-testid="message-body"]'),old=b.textContent.trim();b.innerHTML='<input data-testid="message-edit-input">';let i=b.querySelector('input');i.value=old;i.focus();i.onkeydown=async e=>{if(e.key==='Enter'){let v=i.value.trim();if(v){await js('/messages/'+id,{method:'PATCH',body:{body:v}});openCh(current.id)}}}}
async function delMsg(id){await js('/messages/'+id,{method:'DELETE'});openCh(current.id)}
function picker(id){$('#p'+id).style.display='grid'} async function react(id,e){await js('/messages/'+id+'/reactions',{method:'POST',body:{emoji:e}});openCh(current.id)}
async function openThread(id){thread=id;$('.thread').classList.remove('hidden');let [,b]=await js('/messages/'+id+'/replies');$('#thread-list').innerHTML=(b.replies||[]).map(x=>`<p>${esc(x.body)}</p>`).join('')}
function closeThread(){$('.thread').classList.add('hidden')} async function reply(){let i=$('[data-testid=thread-input]');if(i.value.trim()){await js('/channels/'+current.id+'/messages',{method:'POST',body:{body:i.value,parent_id:thread}});i.value='';openThread(thread);openCh(current.id)}}
async function newChannel(){let m=document.getElementById('create-channel-modal'),f=document.querySelector('[data-testid="create-channel-form"]');m.classList.remove('hidden');f.onsubmit=async e=>{e.preventDefault();let n=f.querySelector('[name=name]').value;let [,ww]=await js('/workspaces');let [r,b]=await js('/workspaces/'+ww.workspaces[0].slug+'/channels',{method:'POST',body:{name:n,is_private:f.querySelector('[data-testid="create-channel-private"]').checked}});if(r.ok){m.classList.add('hidden');f.reset();load()}else{let z=document.querySelector('[data-testid="create-channel-error"]');z.textContent=b.detail||'Channel already exists'}};document.querySelector('[data-testid="create-channel-cancel"]').onclick=()=>m.classList.add('hidden')}
function connect(){if(ws)ws.close();ws=new WebSocket('ws://'+location.host+'/api/ws?token='+auth());ws.onopen=()=>ws.send(JSON.stringify({type:'subscribe',channel_id:current.id}))}
if(auth())load();
</script></body></html>
