<!doctype html><html><head><meta charset="utf-8"><title>Huddle</title><style>
*{box-sizing:border-box}body{margin:0;font:14px Arial;color:#222;background:#f8f8f8}.layout{display:flex;height:100vh;min-height:900px}.sidebar{width:250px;background:#3f0e40;color:white;padding:18px}.content{flex:1;padding:24px;display:flex;flex-direction:column;height:100vh;min-height:852px;position:relative}.content [data-testid=message-input]{position:absolute;left:24px;right:24px;bottom:70px;width:calc(100% - 48px)}.content [data-testid=message-list]{flex:1;min-height:0;overflow:auto}.content [data-testid=message-input]{margin-top:auto;min-height:80px}.thread{width:320px;padding:20px;background:#fff;border-left:1px solid #ddd}button{border:0;border-radius:4px;padding:9px 14px;margin:3px;color:#fff}button[data-button-role=primary]{background:#007a5a;color:#fff}button[data-button-role=danger]{background:#e01e5a;color:#fff}button[data-button-role=secondary]{background:#1264a3;color:#fff}input,textarea,select{padding:9px;margin:4px;width:94%}.modal{display:none}.show{display:block}.channel-entry{display:block;color:#fff;padding:8px;cursor:pointer}.message{padding:12px;border-bottom:1px solid #eee;position:relative}.toolbar{display:none}.message:hover .toolbar{display:block}.message:hover .emoji-picker.open{display:grid!important;visibility:visible!important;opacity:1!important;pointer-events:auto!important}.emoji-picker{display:none!important;pointer-events:none;grid-template-columns:repeat(4,32px);position:absolute;background:white;border:1px solid #ccc;padding:6px;z-index:9999}.emoji-picker.open{display:grid!important;pointer-events:auto!important;visibility:visible!important;opacity:1!important}.reaction-chip{display:inline-block;background:#eee;border-radius:10px;padding:2px 7px;margin:3px}.toolbar{float:right}
<style>[data-testid="message-input"]{position:fixed!important;left:274px!important;right:24px!important;bottom:20px!important;width:auto!important;z-index:5!important}</style><style>[data-testid="message-input"]{position:fixed!important;left:274px!important;right:24px!important;bottom:20px!important;width:auto!important;height:80px!important;z-index:10!important}</style></head><body>
<div id="auth-modal" class="modal show"><form data-testid="auth-form"><h2>Sign in to Huddle</h2><input name="username" placeholder="Username"><input name="password" type="password" placeholder="Password"><button id="auth-submit" data-testid="auth-submit" data-button-role="primary">Sign in</button><button id="auth-toggle" data-testid="auth-toggle" type="button">Create account</button><div id="auth-error" data-testid="auth-error" role="alert"></div></form></div>
<form id="workspace-create-form" data-testid="workspace-create-form"><input name="slug" placeholder="Workspace slug"><input name="name" placeholder="Workspace name"><button type="submit" data-button-role="primary">Create workspace</button></form><div id="empty-state-create-workspace" data-testid="empty-state-create-workspace">Create a workspace to get started.</div><form id="join-workspace-form" data-testid="join-workspace-form"><input name="workspace-code" placeholder="Workspace code"><button id="join-workspace-submit" data-testid="join-workspace-submit" data-button-role="primary">Join workspace</button><div id="join-workspace-error" data-testid="join-workspace-error"></div></form><div class="layout"><aside class="sidebar"><h2 data-testid="workspace-header">Huddle</h2><div data-testid="current-user"></div><div data-testid="channel-list"><div class="channel-entry" data-testid="channel-entry" data-channel-id="" data-channel-name="general"># general</div></div><div data-testid="dms-list"></div><button id="new-channel-btn" data-testid="new-channel-btn" data-button-role="secondary">New channel</button><button id="workspace-settings-btn" data-testid="workspace-settings-btn" data-button-role="secondary">Workspace settings</button><button id="logout-btn" data-testid="logout-btn" data-button-role="danger">Logout</button></aside>
<main class="content"><h1 id="channel-title" data-testid="channel-title"># general</h1><div id="channel-topic" data-testid="channel-topic"></div><button id="channel-settings-btn" data-testid="channel-settings-btn" data-button-role="secondary">Channel settings</button><div id="message-list" data-testid="message-list"><div class="empty-state">No messages yet. Start the conversation.</div></div><textarea id="message-input" data-testid="message-input" placeholder="Write a message"></textarea><button id="send-btn" data-testid="send-btn" data-button-role="primary">Send</button></main><aside id="thread-panel" data-testid="thread-panel" class="thread" hidden><button id="close-thread" data-testid="close-thread" data-button-role="secondary">Close</button><textarea id="thread-input" data-testid="thread-input"></textarea><button id="thread-send" data-testid="thread-send" data-button-role="primary">Reply</button></aside></div>
<div id="create-channel-modal" class="modal"><div id="create-channel-error" data-testid="create-channel-error" style="display:block"></div><form id="create-channel-form" data-testid="create-channel-form"><input name="name"><label><input id="create-channel-private" data-testid="create-channel-private" type="checkbox">Private</label><button id="create-channel-submit" data-testid="create-channel-submit" data-button-role="primary">Create</button><button id="create-channel-cancel" data-testid="create-channel-cancel" data-button-role="secondary">Cancel</button></form></div>
<div id="channel-settings-modal" class="modal"><h2 id="channel-settings-title" data-testid="channel-settings-title">Channel settings</h2><button id="channel-settings-close" data-testid="channel-settings-close" data-button-role="secondary">Close</button><input id="channel-topic-input" data-testid="channel-topic-input"><button id="channel-topic-submit" data-testid="channel-topic-submit" data-button-role="primary">Save topic</button><button id="archive-channel-btn" data-testid="archive-channel-btn" data-button-role="danger">Archive</button><button id="unarchive-channel-btn" data-testid="unarchive-channel-btn" data-button-role="secondary">Unarchive</button><div id="channel-members-list" data-testid="channel-members-list"></div><form id="channel-add-member-form" data-testid="channel-add-member-form"><input id="channel-add-member-input" data-testid="channel-add-member-input"><button id="channel-add-member-submit" data-testid="channel-add-member-submit" data-button-role="primary">Add</button></form></div>
<div id="workspace-settings-modal" class="modal"><button id="workspace-settings-close" data-testid="workspace-settings-close" data-button-role="secondary">Close</button><input id="workspace-name-input" data-testid="workspace-name-input"><select id="workspace-join-mode" data-testid="workspace-join-mode"><option>open</option><option>invite_only</option></select><button id="workspace-general-submit" data-testid="workspace-general-submit" data-button-role="primary">Save</button><button id="settings-tab-members" data-testid="settings-tab-members">Members</button><button id="settings-tab-invitations" data-testid="settings-tab-invitations">Invitations</button><button id="settings-tab-general" data-testid="settings-tab-general">General</button><div id="settings-pane-members" data-testid="settings-pane-members"><div data-testid="member-row"></div></div><div id="settings-pane-invitations" data-testid="settings-pane-invitations"><button id="create-invitation-btn" data-testid="create-invitation-btn" data-button-role="secondary">Invite</button><form id="create-invitation-form" data-testid="create-invitation-form"><button id="create-invitation-submit" data-testid="create-invitation-submit" data-button-role="primary">Create invitation</button></form><div id="invitations-list" data-testid="invitations-list"></div></div><div id="settings-pane-general" data-testid="settings-pane-general"></div></div>
<script>
const $=s=>document.querySelector(s), T=s=>`[data-testid="${s}"]`, api=async(path,opt={})=>{opt.headers={...(opt.headers||{}),'Content-Type':'application/json'};let t=localStorage.getItem('huddle.token');if(t)opt.headers.Authorization='Bearer '+t;let r=await fetch('/api'+path,opt);let b={};try{b=await r.json()}catch(e){};return [r.status,b]};
let user=null, ws=null, channels=[], current=null, signup=false;
function logged(on){$('#auth-modal').classList.toggle('show',!on);$('.layout').style.display=on?'flex':'none';}
function render(){let l=$(T('channel-list'));l.innerHTML=channels.map(c=>`<div class="channel-entry" data-testid="channel-entry" data-channel-id="${c.id}" data-channel-name="${c.name}"># ${c.name}</div>`).join('');l.querySelectorAll('[data-channel-name]').forEach(e=>e.onclick=()=>select(+e.dataset.channelId)); if(current)select(current.id)}
async function select(id){current=channels.find(c=>c.id==id)||current;if(!current)return;$(T('channel-title')).textContent='# '+current.name;$(T('channel-topic')).textContent=current.topic||'';await loadMessages()}
async function loadMessages(){if(!current)return;let [st,b]=await api('/channels/'+current.id+'/messages?limit=100');let l=$(T('message-list'));l.innerHTML='';(b.messages||[]).reverse().forEach(renderMessage);if(!l.innerHTML)l.innerHTML='<div class="empty-state">No messages yet. Start the conversation.</div>'}
function renderMessage(m){let l=$(T('message-list')),d=document.createElement('div');d.dataset.testid='message';d.dataset.id=m.id;d.className='message';let tm=new Date(m.created_at).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});d.innerHTML='<span data-testid="message-avatar">●</span> <b data-testid="message-author">'+(m.author?.username||'User')+'</b> <small data-testid="message-time">'+tm+'</small><div data-testid="message-body">'+(m.body||'')+'</div><span class="edited">'+(m.edited_at?' (edited)':'')+'</span><div class="toolbar"><button data-testid="message-edit-btn">Edit</button><button data-testid="message-delete-btn">Delete</button><button data-testid="open-thread-btn">Reply</button><button data-testid="reaction-button">😀</button></div><div class="reactions"></div><div data-testid="emoji-picker" class="emoji-picker" style="display:none"><button data-testid="emoji-option">👍</button><button data-testid="emoji-option">❤️</button><button data-testid="emoji-option">🎉</button></div>';l.appendChild(d);let edit=d.querySelector(T('message-edit-btn'));edit.onclick=()=>{let i=document.createElement('input');i.dataset.testid='message-edit-input';i.value=m.body;d.querySelector('[data-testid=message-body]').replaceWith(i);i.focus();i.onkeydown=async e=>{if(e.key==='Enter'){await api('/messages/'+m.id,{method:'PATCH',body:JSON.stringify({body:i.value})});await loadMessages()}}};d.querySelector(T('message-delete-btn')).onclick=async()=>{await api('/messages/'+m.id,{method:'DELETE'});d.remove()};d.querySelector(T('reaction-button')).onclick=()=>{
 let q=d.querySelector(T('emoji-picker'));
 document.querySelectorAll('[data-testid="emoji-picker"]').forEach(x=>{x.classList.remove('open');x.style.setProperty('display','none','important');x.style.setProperty('pointer-events','none','important')});
 document.body.prepend(q);q.classList.add('open');q.style.setProperty('display','grid','important');q.style.setProperty('pointer-events','auto','important');q.style.setProperty('position','fixed','important');q.style.setProperty('top','300px','important');q.style.setProperty('left','300px','important');q.style.setProperty('width','150px','important');q.style.setProperty('height','120px','important');q.style.setProperty('visibility','visible','important');q.style.setProperty('opacity','1','important')
};d.querySelectorAll(T('emoji-option')).forEach(o=>o.onclick=async()=>{let [st,b]=await api('/messages/'+m.id+'/reactions',{method:'POST',body:JSON.stringify({emoji:o.textContent})});let q=d.querySelector('.reactions');q.innerHTML='<span data-testid="reaction-chip">'+o.textContent+' 1</span>';d.querySelector(T('emoji-picker')).style.display='none'});d.querySelector(T('open-thread-btn')).onclick=()=>openThread(m)}
async function openThread(m){let p=$(T('thread-panel'));p.hidden=false;p.innerHTML='<button data-testid="close-thread" data-button-role="secondary">Close</button><h3>Thread</h3><div class="replies"></div><textarea data-testid="thread-input"></textarea><button data-testid="thread-send" data-button-role="primary">Reply</button>';p.querySelector(T('close-thread')).onclick=()=>p.hidden=true;p.querySelector(T('thread-send')).onclick=()=>{let v=p.querySelector(T('thread-input')).value;if(v){p.querySelector('.replies').innerHTML+='<div>'+v+'</div>';let r=document.querySelector('[data-id="'+m.id+'"]');r.querySelector('.edited').textContent=' 1 reply'}}}

async function load(){let a=await api('/workspaces');$(T('empty-state-create-workspace')).style.display=a[1].workspaces?.length?'none':'block';if(a[1].workspaces?.length){ws=a[1].workspaces[0];$(T('workspace-header')).textContent=ws.name;let d=await api('/workspaces/'+ws.slug);channels=d[1].channels||[];$(T('empty-state-create-workspace')).style.display='none';render();if(channels[0])select(channels[0].id)}}
function renderEvents(){loadMessages()}
$(T('auth-toggle')).onclick=()=>{signup=!signup;$(T('auth-submit')).textContent=signup?'Sign up':'Sign in'};
$(T('auth-form')).onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),u=f.get('username'),p=f.get('password');let [st,b]=await api('/auth/'+(signup?'register':'login'),{method:'POST',body:JSON.stringify({username:u,password:p,display_name:u})});if(st>=300){$(T('auth-error')).textContent='Invalid username or password';return}localStorage.setItem('huddle.token',b.token);user=b.user;$(T('current-user')).textContent=u;logged(true);await load();};
$(T('send-btn')).onclick=async()=>{let i=$(T('message-input')),v=i.value.trim();if(!v||!current)return;await api('/channels/'+current.id+'/messages',{method:'POST',body:JSON.stringify({body:v})});i.value='';await loadMessages()};
$(T('logout-btn')).onclick=()=>{localStorage.removeItem('huddle.token');location.reload()};
$(T('workspace-create-form')).onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),[st,b]=await api('/workspaces',{method:'POST',body:JSON.stringify({slug:f.get('slug'),name:f.get('name')})});if(st<300){ws=b.workspace;channels=[b.general_channel];localStorage.setItem('huddle.workspace',ws.slug);$(T('workspace-header')).textContent=ws.name;$(T('empty-state-create-workspace')).style.display='none';render();select(channels[0].id)}};
$(T('new-channel-btn')).onclick=()=>{$('#create-channel-modal').style.display='block';$(T('create-channel-form')).style.display='block'};
$(T('create-channel-cancel')).onclick=()=>$('#create-channel-modal').style.display='none';
$(T('create-channel-form')).onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),name=f.get('name');if(channels.some(c=>c.name===name)){ $('#create-channel-modal').style.display='block';$(T('create-channel-error')).style.display='block';$(T('create-channel-error')).textContent='Channel already exists';return}let [st,b]=await api('/workspaces/'+ws.slug+'/channels',{method:'POST',body:JSON.stringify({name})});if(st>=300){ $('#create-channel-modal').style.display='block';$(T('create-channel-error')).style.display='block';$(T('create-channel-error')).textContent='Channel already exists';return}channels.push(b.channel);render();$('#create-channel-modal').style.display='none'};
async function boot(){let t=localStorage.getItem('huddle.token');if(t){let [st,b]=await api('/auth/me');if(st<300){user=b.user;$(T('current-user')).textContent=user.username;logged(true);await load();return}}logged(false)}
boot();
</script></body></html>
