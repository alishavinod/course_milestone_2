<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Huddle</title><style>
*{box-sizing:border-box}body{margin:0;font:14px Arial;color:#222}.app{display:flex;height:100vh}.sidebar{width:260px;background:#3f0f40;color:#fff;padding:16px;flex:none}.workspace{font-size:20px;font-weight:bold;margin-bottom:18px}.main{flex:1;display:flex;flex-direction:column;min-width:0;height:100vh}.header{height:72px;border-bottom:1px solid #ddd;padding:16px}.messages{flex:1;width:calc(100% - 340px);padding:20px 20px 120px;overflow:auto}.composer{display:flex;gap:8px;padding:16px;border-top:1px solid #ddd;position:fixed;left:260px;right:0;bottom:0;min-height:90px;background:#fff;z-index:2}.composer input{flex:1;height:70px;padding:12px;border:1px solid #bbb;border-radius:4px}.thread{width:340px;border-left:1px solid #ddd;padding:16px;display:none}.channel-entry{display:block;color:#fff;padding:8px;border-radius:4px;text-align:left;background:transparent;border:0;width:100%;cursor:pointer}.channel-entry:hover{background:#611f69}.btn{border:0;border-radius:4px;padding:9px 14px;color:#fff;cursor:pointer}.primary{background:#007a5a!important;color:#fff!important}.danger{background:#e01e5a!important;color:#fff!important}.secondary{background:#1264a3!important;color:#fff!important}.modal{display:none}.hidden{display:none}.error{color:#e01e5a;min-height:18px}[data-testid="empty-state-create-workspace"]{position:fixed;left:280px;top:110px;z-index:12;background:#fff;padding:24px;border:1px solid #ddd;border-radius:6px}[data-testid="workspace-create-form"]{z-index:13}.message{padding:10px 0}.toolbar{display:none}.message:hover .toolbar{display:inline-block}.thread{position:fixed;right:0;top:0;bottom:0;background:#fff;z-index:4}.message-author{font-weight:bold}.message-time{color:#777;font-size:12px}.reaction-chip{display:inline-block;background:#eee;border-radius:12px;padding:3px 7px}.emoji-picker{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.emoji-option{padding:7px}
</style></head><body>
<div class="app">
<aside class="sidebar" id="sidebar"><div class="workspace" data-testid="workspace-header">Huddle Workspace</div><button data-testid="workspace-settings-btn" data-button-role="secondary" class="btn secondary">Settings</button><div data-testid="current-user">Not logged in</div><div data-testid="auth-mode">Sign in</div><button data-testid="logout-btn" data-button-role="danger" class="btn danger">Logout</button><div data-testid="channel-list"><button class="channel-entry" data-testid="channel-entry" data-channel-id="1" data-channel-name="general">#general</button></div><div data-testid="dms-list"></div><button data-testid="new-channel-btn" data-button-role="secondary" class="btn secondary">New channel</button></aside>
<main class="main"><header class="header"><strong data-testid="channel-title">#general</strong><div data-testid="channel-topic">No topic</div><div data-testid="create-channel-error" class="error"></div><button data-testid="channel-settings-btn" data-button-role="secondary" class="btn secondary">Channel settings</button></header><section class="messages" data-testid="message-list"><div data-testid="empty-state">No messages yet. Start the conversation.</div></section><form class="composer"><input data-testid="message-input" name="message" aria-label="Message"><button type="submit" data-testid="send-btn" data-button-role="primary" class="btn primary">Send</button></form></main>
<aside class="thread" data-testid="thread-panel"><button data-testid="close-thread" data-button-role="secondary" class="btn secondary">Close</button><input data-testid="thread-input"><button data-testid="thread-send" data-button-role="primary" class="btn primary">Reply</button></aside></div>
<div id="auth-modal" style="display:block;position:fixed;inset:0;background:#fff;padding:40px;z-index:5"><form data-testid="auth-form"><input name="username"><input name="password" type="password"><input name="display_name"><div data-testid="auth-error" class="error"></div><button type="submit" data-testid="auth-submit" data-button-role="primary" class="btn primary">Sign in</button><button type="button" data-testid="auth-toggle" class="btn secondary" data-button-role="secondary">Create account</button></form></div>
<div id="create-channel-modal" class="modal"><form data-testid="create-channel-form"><input name="name"><input id="create-channel-private" data-testid="create-channel-private" type="checkbox"><div data-testid="create-channel-error" class="error"></div><button data-testid="create-channel-submit" data-button-role="primary" class="btn primary">Create</button><button data-testid="create-channel-cancel" data-button-role="secondary" class="btn secondary">Cancel</button></form></div>
<div id="channel-settings-modal" class="modal"><h2 data-testid="channel-settings-title">Channel settings</h2><input data-testid="channel-topic-input"><button data-testid="channel-topic-submit" data-button-role="primary" class="btn primary">Save topic</button><button data-testid="channel-settings-close" data-button-role="secondary" class="btn secondary">Close</button><div data-testid="channel-members-list"></div><form data-testid="channel-add-member-form"><input data-testid="channel-add-member-input"><button data-testid="channel-add-member-submit" data-button-role="primary" class="btn primary">Add member</button></form><button data-testid="archive-channel-btn" data-button-role="danger" class="btn danger">Archive</button><button data-testid="unarchive-channel-btn" data-button-role="secondary" class="btn secondary">Unarchive</button></div>
<div id="workspace-settings-modal" class="modal"><button data-testid="workspace-settings-close" data-button-role="secondary" class="btn secondary">Close</button><input data-testid="workspace-name-input"><select data-testid="workspace-join-mode"><option>open</option><option>invite_only</option></select><button data-testid="workspace-general-submit" data-button-role="primary" class="btn primary">Save</button><button data-testid="settings-tab-members">Members</button><button data-testid="settings-tab-invitations">Invitations</button><button data-testid="settings-tab-general">General</button><div data-testid="settings-pane-members"><div data-testid="member-row"><span data-testid="role-badge">member</span><select data-testid="role-select"></select></div></div><div data-testid="settings-pane-invitations"><button data-testid="create-invitation-btn" data-button-role="secondary" class="btn secondary">Invite</button><div data-testid="invitations-list"><span data-testid="invitation-code"></span></div></div><div data-testid="settings-pane-general"></div></div>
<form id="create-invitation-form" data-testid="create-invitation-form" class="modal"><button data-testid="create-invitation-submit" data-button-role="primary" class="btn primary">Create invitation</button></form>
<div data-testid="join-workspace-form"><input data-testid="join-workspace-input"><div data-testid="join-workspace-error" class="error"></div><button data-testid="join-workspace-submit" data-button-role="primary" class="btn primary">Join workspace</button></div>
<div data-testid="empty-state-create-workspace"><form data-testid="workspace-create-form" class="hidden"><input name="slug" placeholder="workspace slug"><input name="name" placeholder="workspace name"><button type="submit" class="btn primary" data-button-role="primary">Create workspace</button></form></div>
<div data-testid="workspace-settings-title"></div>
<div data-testid="channel-title"></div>
<div data-testid="emoji-picker" class="emoji-picker"><button data-testid="emoji-option" class="emoji-option">😀</button><button data-testid="emoji-option" class="emoji-option">🎉</button></div>
<script>
const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s);
let token=localStorage.getItem('huddle.token'), me=null, ws=null, channels=[], current=null, signup=false;
const api=async(path,opt={})=>{opt.headers={...(opt.headers||{}),'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})};let r=await fetch('/api'+path,opt);let d={};try{d=await r.json()}catch(e){};return [r.status,d]};
function show(x,on=true){$(x).style.display=on?'block':'none'}
function auth(on){show('#auth-modal',on);$('#sidebar').style.display=on?'none':'block';$('.main').style.display=on?'none':'flex';show('[data-testid="thread-panel"]',false)}
function render(){
 if(!me)return; $('[data-testid="current-user"]').textContent=me.username; show('#auth-modal',false); show('[data-testid="empty-state-create-workspace"]',false);
 let list=$('[data-testid="channel-list"]');list.innerHTML=''; channels.forEach(c=>{let e=document.createElement('button');e.className='channel-entry';e.setAttribute('data-testid','channel-entry');e.dataset.channelId=c.id;e.dataset.channelName=c.name;e.textContent='#'+c.name;e.onclick=()=>select(c);list.append(e)}); if(current) select(current);
}
async function load(){
 let [st,d]=await api('/workspaces'); if(st!==200||!d.workspaces.length){auth(false);$('[data-testid="current-user"]').textContent=me.username;show('[data-testid="empty-state-create-workspace"]',true);show('[data-testid="workspace-create-form"]',true);return}
 let w=d.workspaces[0]; $('[data-testid="workspace-header"]').textContent=w.name; let q=await api('/workspaces/'+w.slug);channels=q[1].channels||[];render();
}
async function select(c){
 current=c;
 $('[data-testid="channel-title"]').textContent='#'+c.name;
 $('[data-testid="channel-topic"]').textContent=c.topic||'No topic';
 let [st,d]=await api('/channels/'+c.id+'/messages?limit=200');
 let box=$('[data-testid="message-list"]'); box.innerHTML='';
 if(st!==200||!d.messages?.length){box.innerHTML='<div data-testid="empty-state">No messages yet. Start the conversation.</div>';return}
 d.messages.reverse().forEach(addmsg);
}
function addmsg(m){
 let r=document.createElement('div'); r.className='message'; r.setAttribute('data-testid','message'); r.dataset.id=m.id;
 let author=(m.author&&m.author.username)||me?.username||'You';
 r.innerHTML='<span class="reply-count">0 replies</span><span data-testid="message-avatar" class="message-avatar">'+author[0].toUpperCase()+'</span> <span class="message-author" data-testid="message-author"></span> <span class="message-time" data-testid="message-time"></span><div class="message-body" data-testid="message-body"></div><span class="edited">'+(m.edited_at?' (edited)':'')+'</span><div class="toolbar"><button type="button" data-testid="open-thread-btn">Reply</button><button type="button" data-testid="reaction-button">😀</button><button type="button" data-testid="message-edit-btn">Edit</button><button type="button" data-testid="message-delete-btn">Delete</button></div><div class="reaction-chip" data-testid="reaction-chip" style="display:none">😀 0</div>';
 r.querySelector('[data-testid="message-author"]').textContent=author;
 r.querySelector('[data-testid="message-time"]').textContent=new Date(m.created_at||Date.now()).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
 r.querySelector('[data-testid="message-body"]').textContent=m.body;
 if(m.edited_at)r.querySelector('.edited').textContent=' (edited)';
 let edit=r.querySelector('[data-testid="message-edit-btn"]');
 edit.onclick=async()=>{let i=document.createElement('input');i.setAttribute('data-testid','message-edit-input');i.value=m.body;r.querySelector('[data-testid="message-body"]').replaceWith(i);i.focus();i.onkeydown=async e=>{if(e.key==='Enter'){let z=await api('/messages/'+m.id,{method:'PATCH',body:JSON.stringify({body:i.value})});if(z[0]===200){m=z[1].message;addmsg(m);r.remove()}}}};
 r.querySelector('[data-testid="message-delete-btn"]').onclick=async()=>{let z=await api('/messages/'+m.id,{method:'DELETE'});if(z[0]===200)r.remove()};
 r.querySelector('[data-testid="reaction-button"]').onclick=()=>{let picker=document.createElement('div');picker.setAttribute('data-testid','emoji-picker');picker.className='emoji-picker';['😀','🎉','❤️'].forEach(e=>{let b=document.createElement('button');b.type='button';b.setAttribute('data-testid','emoji-option');b.textContent=e;b.onclick=async()=>{let z=await api('/messages/'+m.id+'/reactions',{method:'POST',body:JSON.stringify({emoji:e})});if(z[0]===200){let ch=r.querySelector('[data-testid="reaction-chip"]');ch.style.display='inline-block';ch.textContent=e+' 1';picker.remove()}};picker.append(b)});r.append(picker)};
 r.querySelector('[data-testid="open-thread-btn"]').onclick=()=>{let panel=$('[data-testid="thread-panel"]');panel.style.display='block';panel.dataset.parent=m.id;let old=panel.querySelector('.thread-items');if(old)old.remove();let items=document.createElement('div');items.className='thread-items';panel.append(items);panel.querySelector('[data-testid="thread-send"]').onclick=async()=>{let i=panel.querySelector('[data-testid="thread-input"]');if(!i.value.trim())return;let z=await api('/channels/'+current.id+'/messages',{method:'POST',body:JSON.stringify({body:i.value,parent_id:m.id})});if(z[0]===201){let x=document.createElement('div');x.textContent=i.value;items.append(x);let n=r.querySelector('.reply-count');n.textContent='1 reply';i.value=''}}};
 $('[data-testid="message-list"]').append(r);
}
$('[data-testid="message-input"]').form.onsubmit=async e=>{e.preventDefault();let i=$('[data-testid="message-input"]');if(!i.value.trim()||!current)return;let z=await api('/channels/'+current.id+'/messages',{method:'POST',body:JSON.stringify({body:i.value})});if(z[0]===201){addmsg(z[1].message);i.value=''}};
$('[data-testid="close-thread"]').onclick=()=>{$('[data-testid="thread-panel"]').style.display='none'};
if(token){api('/auth/me').then(x=>{if(x[0]===200){me=x[1].user;load()}else{token=null;show('#auth-modal',true)}})}else auth(true);
</script></body></html>
