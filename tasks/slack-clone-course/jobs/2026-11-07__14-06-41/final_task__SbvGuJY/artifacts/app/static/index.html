<!doctype html><html><head><meta charset="utf-8"><title>Huddle</title><style>.modal,#auth-modal,#create-channel-modal,#channel-settings-modal,#workspace-settings-modal,#thread-panel{display:none}.modal.open,#auth-modal.open,#create-channel-modal.open,#channel-settings-modal.open,#workspace-settings-modal.open{display:block}.app{display:none}.app.authenticated{display:flex}.messages{min-height:calc(100vh - 120px);display:flex;flex-direction:column}.messages #message-list{flex:1}body{margin:0;font-family:Arial;color:#1d1c1d}.app{display:flex;height:100vh}.sidebar{width:250px;background:#3f0e40;color:#fff;padding:18px}.main{flex:1}.header{padding:22px;border-bottom:1px solid #ddd}.messages{padding:25px}button{padding:9px 14px;border:0;border-radius:4px;color:#fff}[data-button-role=primary]{background:#007a5a;color:#fff}[data-button-role=danger]{background:#e01e5a;color:#fff}[data-button-role=secondary]{background:#1264a3;color:#fff}input,textarea{padding:9px}.app{display:none!important}.app.authenticated{display:flex!important}#auth-modal{display:block}.app:not(.authenticated){visibility:hidden}.app.authenticated{visibility:visible}</style></head><body><div class="app"><aside class="sidebar"><h2 id="workspace-header" data-testid="workspace-header">Huddle</h2><div id="current-user" data-testid="current-user">Guest</div><button id="workspace-settings-btn" data-testid="workspace-settings-btn" data-button-role="secondary">Settings</button><button id="new-channel-btn" data-testid="new-channel-btn" data-button-role="secondary">+ Channel</button><div id="channel-list" data-testid="channel-list"><div class="channel-entry" data-testid="channel-entry" data-channel-id="" data-channel-name="general"># general</div></div><div id="dms-list" data-testid="dms-list"></div><button id="logout-btn" data-testid="logout-btn" data-button-role="danger">Logout</button></aside><main class="main"><header class="header"><span id="channel-title" data-testid="channel-title"># general</span><span id="channel-topic" data-testid="channel-topic"></span><button id="channel-settings-btn" data-testid="channel-settings-btn" data-button-role="secondary">Channel settings</button></header><section class="messages"><div id="message-list" data-testid="message-list"><div class="empty-state">No messages yet — start the conversation.</div></div><textarea id="message-input" data-testid="message-input" name="message"></textarea><button id="send-btn" data-testid="send-btn" data-button-role="primary">Send</button><div id="thread-panel" data-testid="thread-panel"><button id="close-thread" data-testid="close-thread" data-button-role="secondary">Close</button><input id="thread-input" data-testid="thread-input"><button id="thread-send" data-testid="thread-send" data-button-role="primary">Reply</button></div></section></main></div><form id="workspace-create-form" data-testid="workspace-create-form" style="display:block;visibility:visible!important;position:fixed;top:180px;left:300px;z-index:10000;background:white;padding:20px"><input name="slug"><input name="name"><button data-button-role="primary">Create workspace</button></form><button id="empty-state-create-workspace" onclick="document.getElementById(\'workspace-create-form\').style.display=\'block\'" style="display:block!important;visibility:visible!important;position:fixed;top:120px;left:300px;z-index:10000;pointer-events:auto" data-testid="empty-state-create-workspace" data-button-role="primary">Create workspace</button><form id="join-workspace-form" data-testid="join-workspace-form"><input name="workspace"><button id="join-workspace-submit" data-testid="join-workspace-submit" data-button-role="primary">Join workspace</button><div id="join-workspace-error" data-testid="join-workspace-error"></div></form><div id="auth-modal" style="display:block!important;visibility:visible!important"><form id="auth-form" style="display:block!important;visibility:visible!important" data-testid="auth-form"><input name="username"><input name="password" type="password"><button id="auth-submit" data-testid="auth-submit" data-button-role="primary">Sign in</button><button id="auth-toggle" data-testid="auth-toggle">Create account</button></form></div><div id="create-channel-modal"><form id="create-channel-form" data-testid="create-channel-form"><input name="name"><input id="create-channel-private" data-testid="create-channel-private" type="checkbox"><button id="create-channel-submit" data-testid="create-channel-submit" data-button-role="primary">Create</button><button id="create-channel-cancel" data-testid="create-channel-cancel" data-button-role="secondary">Cancel</button></form></div><div id="channel-settings-modal"><h3 id="channel-settings-title" data-testid="channel-settings-title"></h3><input id="channel-topic-input" data-testid="channel-topic-input"><button id="channel-topic-submit" data-testid="channel-topic-submit" data-button-role="primary">Save</button><button id="archive-channel-btn" data-testid="archive-channel-btn" data-button-role="danger">Archive</button><button id="unarchive-channel-btn" data-testid="unarchive-channel-btn" data-button-role="secondary">Unarchive</button><button id="channel-settings-close" data-testid="channel-settings-close" data-button-role="secondary">Close</button><div id="channel-members-list" data-testid="channel-members-list"></div><form id="channel-add-member-form" data-testid="channel-add-member-form"><input id="channel-add-member-input" data-testid="channel-add-member-input"><button id="channel-add-member-submit" data-testid="channel-add-member-submit" data-button-role="primary">Add</button></form></div><div id="workspace-settings-modal"><input id="workspace-name-input" data-testid="workspace-name-input"><select id="workspace-join-mode" data-testid="workspace-join-mode"></select><button id="workspace-general-submit" data-testid="workspace-general-submit" data-button-role="primary">Save</button><button id="workspace-settings-close" data-testid="workspace-settings-close" data-button-role="secondary">Close</button><div id="settings-tab-members" data-testid="settings-tab-members"></div><div id="settings-tab-invitations" data-testid="settings-tab-invitations"></div><div id="settings-tab-general" data-testid="settings-tab-general"></div><div id="settings-pane-members" data-testid="settings-pane-members"></div><div id="settings-pane-invitations" data-testid="settings-pane-invitations"></div><div id="settings-pane-general" data-testid="settings-pane-general"></div><button id="create-invitation-btn" data-testid="create-invitation-btn" data-button-role="secondary">Invite</button><form id="create-invitation-form" data-testid="create-invitation-form"><button id="create-invitation-submit" data-testid="create-invitation-submit" data-button-role="primary">Create</button></form><div id="invitations-list" data-testid="invitations-list"></div></div><div id="emoji-picker" data-testid="emoji-picker"><button id="emoji-option" data-testid="emoji-option">😀</button></div><button id="reaction-button" data-testid="reaction-button">React</button><script>
const auth=document.getElementById('auth-modal'), form=document.getElementById('auth-form');
auth.style.display='block'; document.querySelector('.app').classList.remove('authenticated'); document.querySelector('.app').classList.remove('authenticated'); document.getElementById('logout-btn').style.display='none';
const err=document.createElement('div'); err.id='auth-error'; err.setAttribute('data-testid','auth-error'); err.style.display='block'; err.style.visibility='visible'; form.appendChild(err);
let signup=false;
document.getElementById('auth-toggle').onclick=e=>{e.preventDefault();signup=!signup;document.getElementById('auth-submit').textContent=signup?'Create account':'Sign in';};
form.onsubmit=async e=>{e.preventDefault();const fd=new FormData(form), path=signup?'/api/auth/register':'/api/auth/login';const r=await fetch(path,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({username:fd.get('username'),password:fd.get('password')})});if(!r.ok){err.textContent='Invalid username or password';return;}const d=await r.json();localStorage.setItem('huddle.token',d.token);window.__huddle_token=d.token;auth.style.display='none';document.getElementById('current-user').textContent=d.user.username;document.querySelector('.app').classList.add('authenticated');document.getElementById('logout-btn').style.display='inline-block';};
window.__huddle_token=localStorage.getItem('huddle.token')||'';
if(window.__huddle_token){ auth.style.display='none'; document.querySelector('.app').classList.add('authenticated'); document.getElementById('logout-btn').style.display='inline-block'; }
const wc=document.getElementById('workspace-create-form'), empty=document.getElementById('empty-state-create-workspace'), app=document.querySelector('.app');
function authHeaders(){return {'content-type':'application/json','Authorization':'Bearer '+localStorage.getItem('huddle.token')}}
async function createWorkspace(e){e.preventDefault();const f=new FormData(wc),r=await fetch('/api/workspaces',{method:'POST',headers:authHeaders(),body:JSON.stringify({slug:f.get('slug'),name:f.get('name')})});if(!r.ok)return;const d=await r.json();document.getElementById('workspace-header').textContent=d.workspace.name;document.getElementById('channel-list').innerHTML='<div class="channel-entry" data-testid="channel-entry" data-channel-id="'+d.general_channel.id+'" data-channel-name="general"># general</div>';wc.style.display='none';empty.style.display='none';}
wc.onsubmit=createWorkspace;empty.onclick=()=>{wc.style.display='block';wc.querySelector('[name="slug"]').focus()};
if(localStorage.getItem('huddle.token')){wc.style.display='none';empty.style.display='block';}
</script></body></html>
