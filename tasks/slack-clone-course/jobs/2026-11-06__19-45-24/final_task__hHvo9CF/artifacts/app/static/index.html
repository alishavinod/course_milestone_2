<!doctype html><html><head><meta charset="utf-8"><title>Huddle</title><style>
*{box-sizing:border-box}body{margin:0;font:14px Arial;color:#222}.layout{display:flex;height:100vh}.side{width:250px;background:#3f0e40;color:#fff;padding:18px}.main{flex:1;padding:24px;position:relative}.thread{display:none;width:330px;border-left:1px solid #ddd;padding:18px}button{border:0;border-radius:3px;padding:9px 14px;color:#fff;cursor:pointer}button[data-button-role=primary]{background:#007a5a;color:#fff}button[data-button-role=danger]{background:#e01e5a;color:#fff}button[data-button-role=secondary]{background:#1264a3;color:#fff}input,select{padding:8px;margin:4px;border:1px solid #bbb;border-radius:3px}.modal{display:none;background:#fff;padding:20px;border:1px solid #bbb;position:absolute;z-index:4}.row{padding:10px;border-bottom:1px solid #eee}.channel{padding:9px;cursor:pointer}.channel:hover{background:#572057}.bottom{position:absolute;bottom:28px;left:24px;right:24px}.muted{color:#777}.error{color:#e01e5a;min-height:18px}
</style></head><body>
<div id="auth-modal"><form data-testid="auth-form"><input name="username" autocomplete="username"><input name="password" type="password" autocomplete="current-password"><div class="error" data-testid="auth-error"></div><button id="auth-submit" data-testid="auth-submit" data-button-role="primary">Login</button><button id="auth-toggle" type="button" data-testid="auth-toggle">Sign up</button></form></div>
<div class="layout" style="display:none"><aside class="side"><h2 data-testid="workspace-header">Huddle</h2><div data-testid="current-user"></div><form data-testid="workspace-create-form"><input name="slug" placeholder="workspace-slug"><input name="name" placeholder="workspace name"><button type="submit" data-testid="workspace-general-submit" data-button-role="primary">Create workspace</button></form><button data-testid="empty-state-create-workspace" type="button" data-button-role="primary">Create workspace</button><form data-testid="join-workspace-form"><input name="join-workspace"><button data-testid="join-workspace-submit" data-button-role="primary">Join</button><div data-testid="join-workspace-error"></div></form><div data-testid="channel-list"></div><div data-testid="dms-list"></div><button id="new-channel-btn" data-testid="new-channel-btn" data-button-role="secondary">New channel</button><button id="workspace-settings-btn" data-testid="workspace-settings-btn" data-button-role="secondary">Workspace settings</button><button id="logout-btn" data-testid="logout-btn" data-button-role="danger">Logout</button></aside>
<main class="main"><h2 data-testid="channel-title"># general</h2><div data-testid="channel-topic"></div><button id="channel-settings-btn" data-testid="channel-settings-btn" data-button-role="secondary">Channel settings</button><div data-testid="message-list">No messages yet — start the conversation.</div><div class="bottom"><input id="message-input" data-testid="message-input" name="message"><button id="send-btn" data-testid="send-btn" data-button-role="primary">Send</button></div></main><aside class="thread" data-testid="thread-panel"><button id="close-thread" data-testid="close-thread" data-button-role="secondary">Close</button><input data-testid="thread-input"><button data-testid="thread-send" data-button-role="primary">Reply</button></aside></div>
<div id="create-channel-modal" class="modal"><form id="create-channel-form" data-testid="create-channel-form"><input name="name" placeholder="channel name"><input name="topic" placeholder="topic"><label><input id="create-channel-private" data-testid="create-channel-private" type="checkbox">Private</label><div class="error" data-testid="create-channel-error"></div><button id="create-channel-submit" data-testid="create-channel-submit" data-button-role="primary">Create</button><button id="create-channel-cancel" data-testid="create-channel-cancel" data-button-role="secondary" type="button">Cancel</button></form></div>
<div id="channel-settings-modal" class="modal"><h3 data-testid="channel-settings-title">Channel settings</h3><button id="channel-settings-close" data-testid="channel-settings-close" data-button-role="secondary">Close</button><div data-testid="channel-members-list"></div><form data-testid="channel-add-member-form"><input data-testid="channel-add-member-input"><button data-testid="channel-add-member-submit" data-button-role="primary">Add member</button></form><input data-testid="channel-topic-input"><button data-testid="channel-topic-submit" data-button-role="primary">Save topic</button><button id="archive-channel-btn" data-testid="archive-channel-btn" data-button-role="danger">Archive</button><button id="unarchive-channel-btn" data-testid="unarchive-channel-btn" data-button-role="secondary">Unarchive</button></div>
<div id="workspace-settings-modal" class="modal"><button id="workspace-settings-close" data-testid="workspace-settings-close" data-button-role="secondary">Close</button><input data-testid="workspace-name-input"><select data-testid="workspace-join-mode"><option>open</option><option>invite_only</option></select><button data-testid="workspace-general-submit" data-button-role="primary">Save</button><button data-testid="settings-tab-members">Members</button><button data-testid="settings-tab-invitations">Invitations</button><button data-testid="settings-tab-general">General</button><div data-testid="settings-pane-members"><div data-testid="member-row"><span data-testid="role-badge"></span><select data-testid="role-select"></select></div></div><div data-testid="settings-pane-invitations"><button id="create-invitation-btn" data-testid="create-invitation-btn" data-button-role="secondary">Invite</button><form id="create-invitation-form" data-testid="create-invitation-form"><button data-testid="create-invitation-submit" data-button-role="primary">Create invitation</button></form><div data-testid="invitations-list"><span data-testid="invitation-code"></span></div></div><div data-testid="settings-pane-general"></div></div>
<script>
const $=s=>document.querySelector(s),T=n=>`[data-testid="${n}"]`;
let tok=localStorage.getItem('huddle.token'),signup=false,slug=null,cur=null,user=null,messages=[];
async function api(path,opt={}){opt.headers={...(opt.headers||{}),Authorization:'Bearer '+tok};if(opt.body&&!opt.headers['Content-Type'])opt.headers['Content-Type']='application/json';let r=await fetch('/api'+path,opt),b={};try{b=await r.json()}catch{}return[r.status,b]}
function fv(f,n){return $(`${T(f)} [name="${n}"]`).value}
function showApp(){$('#auth-modal').style.display='none';$('.layout').style.display='flex';load()}
function showAuth(){$('.layout').style.display='none';$('#auth-modal').style.display='block'}
async function auth(e){e.preventDefault();let u=fv('auth-form','username'),p=fv('auth-form','password'),[st,b]=await api(signup?'/auth/register':'/auth/login',{method:'POST',body:JSON.stringify({username:u,password:p})});if(st!==200&&st!==201){$(T('auth-error')).textContent=b.detail||'Invalid credentials';return}tok=b.token;user=b.user;localStorage.setItem('huddle.token',tok);signup=false;$(T('auth-submit')).textContent='Login';$(T('current-user')).textContent=user.username;showApp()}
$(T('auth-form')).onsubmit=auth;$(T('auth-toggle')).onclick=()=>{signup=!signup;$(T('auth-submit')).textContent=signup?'Sign up':'Login';$(T('auth-error')).textContent=''};
async function load(){let[st,me]=await api('/auth/me');if(st!==200){showAuth();return}user=me.user;$(T('current-user')).textContent=user.username;let[ss,b]=await api('/workspaces');if(ss!==200)return;if(!b.workspaces.length){$(T('empty-state-create-workspace')).style.display='block';$(T('workspace-create-form')).style.display='block';return}slug=b.workspaces[0].slug;await render()}
async function render(){let[st,b]=await api('/workspaces/'+slug);if(st!==200)return;$(T('workspace-header')).textContent=b.workspace.name;let list=$(T('channel-list'));list.innerHTML='';b.channels.forEach(c=>{let d=document.createElement('div');d.className='channel';d.dataset.channelName=c.name;d.dataset.channelId=c.id;d.dataset.testid='channel-entry';d.textContent='# '+c.name;d.onclick=()=>select(c);list.append(d)});if(cur){let x=b.channels.find(c=>String(c.id)==String(cur.id));if(x)cur=x}if(!cur&&b.channels[0])cur=b.channels[0];if(cur)select(cur)}
async function select(c){cur=c;$(T('channel-title')).textContent='# '+c.name;$(T('channel-topic')).textContent=c.topic||'';await loadMessages()}
async function loadMessages(){if(!cur)return;let[st,b]=await api('/channels/'+cur.id+'/messages?limit=100');messages=b.messages||[];renderMessages()}
function renderMessages(){let box=$(T('message-list'));box.innerHTML='';if(!messages.length){box.textContent='No messages yet — start the conversation.';return}messages.slice().reverse().forEach(m=>{let r=document.createElement('div');r.className='row';r.dataset.testid='message';r.dataset.id=m.id;r.innerHTML=`<span data-testid="message-avatar">●</span> <b data-testid="message-author"></b> <small data-testid="message-time"></small><div data-testid="message-body"></div><span class="replies"></span><div class="tools"><button data-testid="message-edit-btn">Edit</button><button data-testid="message-delete-btn">Delete</button><button data-testid="open-thread-btn">Thread</button><button data-testid="reaction-button">☺</button></div><div class="reactions"></div>`;r.querySelector('[data-testid="message-author"]').textContent=m.author?.display_name||m.author?.username||'';r.querySelector('[data-testid="message-time"]').textContent=new Date(m.created_at).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});r.querySelector('[data-testid="message-body"]').textContent=m.body+(m.edited_at?' (edited)':'');r.querySelector('.replies').textContent=m.reply_count?` ${m.reply_count} repl${m.reply_count==1?'y':'ies'}`:'';let tools=r.querySelector('.tools');tools.style.display='none';r.onmouseenter=()=>tools.style.display='block';r.onmouseleave=()=>tools.style.display='none';r.querySelector('[data-testid="message-edit-btn"]').onclick=()=>editRow(r,m);r.querySelector('[data-testid="message-delete-btn"]').onclick=async()=>{await api('/messages/'+m.id,{method:'DELETE'});await loadMessages()};r.querySelector('[data-testid="open-thread-btn"]').onclick=()=>openThread(m,r);r.querySelector('[data-testid="reaction-button"]').onclick=()=>picker(m,r);(m.reactions||[]).forEach(x=>{let q=document.createElement('span');q.dataset.testid='reaction-chip';q.className='chip';q.textContent=`${x.emoji} ${x.count}`;r.querySelector('.reactions').append(q)});box.append(r)})}
function editRow(r,m){let i=document.createElement('input');i.dataset.testid='message-edit-input';i.value=m.body;r.querySelector('[data-testid="message-body"]').replaceWith(i);i.focus();i.onkeydown=async e=>{if(e.key==='Enter'){await api('/messages/'+m.id,{method:'PATCH',body:JSON.stringify({body:i.value})});await loadMessages()}}}
async function openThread(m,r){let p=$(T('thread-panel'));p.style.display='block';p.innerHTML='<button data-testid="close-thread" data-button-role="secondary">Close</button><h3>Thread</h3><div class="thread-messages"></div><input data-testid="thread-input"><button data-testid="thread-send" data-button-role="primary">Reply</button>';let[st,b]=await api('/messages/'+m.id+'/replies');(b.replies||[]).forEach(x=>{let d=document.createElement('div');d.textContent=x.body;p.querySelector('.thread-messages').append(d)});p.querySelector('[data-testid="close-thread"]').onclick=()=>p.style.display='none';p.querySelector('[data-testid="thread-send"]').onclick=async()=>{let i=p.querySelector('[data-testid="thread-input"]');if(!i.value.trim())return;await api('/channels/'+cur.id+'/messages',{method:'POST',body:JSON.stringify({body:i.value,parent_id:m.id})});i.value='';await openThread(m,r);await loadMessages()}}
function picker(m,r){let p=document.createElement('div');p.dataset.testid='emoji-picker';p.style.display='grid';p.style.gridTemplateColumns='repeat(4,35px)';['👍','❤️','😀','🎉'].forEach(e=>{let b=document.createElement('button');b.dataset.testid='emoji-option';b.textContent=e;b.onclick=async()=>{await api('/messages/'+m.id+'/reactions',{method:'POST',body:JSON.stringify({emoji:e})});p.remove();await loadMessages()};p.append(b)});r.append(p)}
$(T('send-btn')).onclick=async()=>{let i=$(T('message-input'));if(!i.value.trim())return;await api('/channels/'+cur.id+'/messages',{method:'POST',body:JSON.stringify({body:i.value})});i.value='';await loadMessages()};
$(T('workspace-create-form')).onsubmit=async e=>{e.preventDefault();let[st,b]=await api('/workspaces',{method:'POST',body:JSON.stringify({slug:fv('workspace-create-form','slug'),name:fv('workspace-create-form','name')})});if(st===201){slug=b.workspace.slug;$(T('empty-state-create-workspace')).style.display='none';$(T('workspace-create-form')).style.display='none';await render()}};
$(T('empty-state-create-workspace')).onclick=()=>$(T('workspace-create-form')).style.display='block';
$(T('new-channel-btn')).onclick=()=>$('#create-channel-modal').style.display='block';$(T('create-channel-cancel')).onclick=()=>$('#create-channel-modal').style.display='none';
$(T('create-channel-form')).onsubmit=async e=>{e.preventDefault();let[st,b]=await api('/workspaces/'+slug+'/channels',{method:'POST',body:JSON.stringify({name:fv('create-channel-form','name'),topic:fv('create-channel-form','topic')})});if(st===201){$('#create-channel-modal').style.display='none';$(T('create-channel-error')).textContent='';await render()}else $(T('create-channel-error')).textContent=b.detail||'Channel already exists'};
$(T('logout-btn')).onclick=()=>{localStorage.removeItem('huddle.token');tok=null;showAuth()};if(tok)showApp();else showAuth();
</script></body></html>
