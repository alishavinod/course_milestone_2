<!doctype html><html><head><meta charset="utf-8"><title>Huddle</title><style>
body{font:15px Arial;margin:0;color:#222}header{background:#4a154b;color:white;padding:16px}main{padding:24px;max-width:700px;margin:auto}input,button{padding:10px;margin:4px}button{background:#007a5a;color:#fff;border:0;border-radius:3px}
</style></head><body><header><b>Huddle</b></header><main><h1>Team chat</h1><form id="auth-form" data-testid="auth-form"><input name="username" placeholder="username"><input name="password" type="password" placeholder="password"><button id="auth-submit" data-testid="auth-submit" data-button-role="primary">Sign in</button></form><p id="status"></p><script>
const f=document.querySelector('form');f.onsubmit=async e=>{e.preventDefault();let b=Object.fromEntries(new FormData(f));let r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});let j=await r.json();if(r.ok){localStorage.setItem('huddle.token',j.token);document.querySelector('#status').textContent='Signed in as '+j.user.display_name}else document.querySelector('#status').textContent=j.error||'Unable to sign in'};
</script></main></body></html>
