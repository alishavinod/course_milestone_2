<!doctype html><html><head><meta charset="utf-8"><title>Huddle</title><link rel="stylesheet" href="/static/style.css"></head><body>
<div id="auth-modal"><form data-testid="auth-form" id="auth-form"><h1>Huddle</h1><input name="username" placeholder="username" required><input name="password" type="password" placeholder="password" required><div id="auth-error" data-testid="auth-error"></div><button id="auth-submit" data-testid="auth-submit" data-button-role="primary" type="submit">Log in</button><button id="auth-toggle" data-testid="auth-toggle" type="button">Sign up</button></form></div>
<div id="app" hidden><aside><header id="workspace-header" data-testid="workspace-header"></header><button data-testid="workspace-settings-btn" data-button-role="secondary">Settings</button><span id="current-user" data-testid="current-user"></span><button id="logout-btn" data-testid="logout-btn" data-button-role="danger">Log out</button><h3>Channels</h3><div id="channel-list" data-testid="channel-list"></div><div data-testid="dms-list"></div><button id="new-channel-btn" id="new-channel-btn" data-testid="new-channel-btn" data-button-role="secondary">New channel</button><form id="workspace-create-form" data-testid="workspace-create-form" hidden><input name="slug"><input name="name"><button type="submit">Create workspace</button></form><button id="empty-state-create-workspace" data-testid="empty-state-create-workspace" hidden>Create workspace</button><form data-testid="join-workspace-form" hidden><input name="slug"><button data-testid="join-workspace-submit" data-button-role="primary" type="submit">Join workspace</button><div data-testid="join-workspace-error"></div></form></aside>
<main><div class="top"><b id="channel-title" data-testid="channel-title"></b><span id="channel-topic" data-testid="channel-topic"></span><button data-testid="channel-settings-btn" data-button-role="secondary">Channel settings</button></div><div id="message-list" data-testid="message-list">No messages yet.</div><form id="composer"><input id="message-input" data-testid="message-input" autocomplete="off"><button id="send-btn" data-testid="send-btn" data-button-role="primary">Send</button></form></main>
<section id="thread-panel" data-testid="thread-panel" hidden><button id="close-thread" data-testid="close-thread" data-button-role="secondary">Close</button><div id="thread-list"></div><form id="thread-form"><input id="thread-input" data-testid="thread-input"><button id="thread-send" data-testid="thread-send" data-button-role="primary">Reply</button></form></section></div>
<div id="create-channel-modal" hidden><form id="create-channel-form" data-testid="create-channel-form"><input name="name"><label><input id="create-channel-private" data-testid="create-channel-private" type="checkbox">private</label><div data-testid="create-channel-error" id="create-channel-error"></div><button id="create-channel-submit" data-testid="create-channel-submit" data-button-role="primary">Create</button><button id="create-channel-cancel" data-testid="create-channel-cancel" data-button-role="secondary" type="button">Cancel</button></form></div>
<div id="channel-settings-modal" hidden><h2 data-testid="channel-settings-title">Channel settings</h2><button data-testid="channel-settings-close" data-button-role="secondary">Close</button><div data-testid="channel-members-list"></div><form data-testid="channel-add-member-form"><input data-testid="channel-add-member-input"><button data-testid="channel-add-member-submit" data-button-role="primary">Add</button></form><input data-testid="channel-topic-input"><button data-testid="channel-topic-submit" data-button-role="primary">Save topic</button><button data-testid="archive-channel-btn" data-button-role="danger">Archive</button><button data-testid="unarchive-channel-btn" data-button-role="secondary">Unarchive</button></div>
<div id="workspace-settings-modal" hidden><button data-testid="workspace-settings-close" data-button-role="secondary">Close</button><input data-testid="workspace-name-input"><select data-testid="workspace-join-mode"><option>open</option></select><button data-testid="workspace-general-submit" data-button-role="primary">Save</button><button data-testid="settings-tab-members">Members</button><button data-testid="settings-tab-invitations">Invitations</button><button data-testid="settings-tab-general">General</button><div data-testid="settings-pane-members"></div><div data-testid="settings-pane-invitations"></div><div data-testid="settings-pane-general"></div><button data-testid="create-invitation-btn" data-button-role="secondary">Invite</button><form id="create-invitation-form" data-testid="create-invitation-form"><button data-testid="create-invitation-submit" data-button-role="primary">Create</button></form><div data-testid="invitations-list"></div></div>
<script src="/static/app.js"></script></body></html>
